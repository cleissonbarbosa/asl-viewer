name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18, 20, 22]

    name: Test on Node.js ${{ matrix.node-version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: "yarn"

      - name: Install dependencies
        run: yarn install --frozen-lockfile --ignore-engines

      - name: Run linting (if available)
        run: |
          if yarn run | grep -q "lint"; then
            yarn lint
          else
            echo "No linting script found, skipping..."
          fi
        continue-on-error: true

      - name: Run tests
        run: yarn test

      - name: Build project
        run: yarn build

      - name: Check build artifacts
        run: |
          ls -la dist/
          # Every file published through package.json "files" must exist
          node -e "
            const fs = require('fs');
            const { files } = require('./package.json');
            const missing = files.filter((file) => !fs.existsSync(file));
            if (missing.length) {
              console.error('Build failed, missing: ' + missing.join(', '));
              process.exit(1);
            }
          "

      - name: Smoke test package entry points
        run: |
          node -e "const lib = require('./dist/index.cjs'); if (typeof lib.WorkflowViewer !== 'function') { console.error('CommonJS entry is broken'); process.exit(1); }"
          node --input-type=module -e "const lib = await import('asl-viewer'); if (typeof lib.WorkflowViewer !== 'function') { console.error('ESM entry is broken'); process.exit(1); }"

  build-storybook:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "yarn"

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build Storybook
        run: yarn build-storybook

      - name: Upload Storybook artifacts
        uses: actions/upload-artifact@v5
        with:
          name: storybook-build
          path: storybook-static/
          retention-days: 7
